# Reusable workflow to render helm charts and validate their manifests using kubeconform
# A comment is made on the pull request containing the output

name: render helm charts and validate k8s manifests
on:
  workflow_call:
    inputs:
      strict:
        required: false
        description: "Run kubeconform with strict validation"
        default: false
        type: boolean

defaults:
  run:
    # The built-in `shell: bash` (-eo pipefail), plus -u to fail on unset variables
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  KUBECONFORM_VERSION: "0.7.0"
  KUBECONFORM_SHA256: "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
  KUBECONFORM_BASE_URL: "https://github.com/yannh/kubeconform/releases/download"
  KUBECONFORM_SCHEMA_LOCATION: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
  KUBECONFORM_CUSTOM_SCHEMA_LOCATION: "https://storage.googleapis.com/moz-fx-platform-shared-global-mozcloud-tools/crdSchemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

jobs:
  get_changed_helm_charts:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.find_changed_charts.outputs.charts }}
    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
         fetch-depth: '100'
         persist-credentials: true # We are using these credentials in later steps

      - name: find changed helm charts
        id: find_changed_charts
        run: |
          git fetch origin "$GITHUB_BASE_REF:$GITHUB_BASE_REF"
          # Any file in a chart directory can change the rendered output (templates, values, Chart.lock,
          # .helmignore, files loaded with .Files.Get), so look at every changed file under k8s/
          # Assigned first so a git diff failure fails the step (it wouldn't inside the for loop's word list)
          changed_dirs=$(git diff --name-only "$GITHUB_BASE_REF...HEAD" -- ':(glob)**/k8s/**' | cut -d'/' -f1,2,3 | sort -u)

          charts=()
          for dir in $changed_dirs; do
            if [ -f "$dir/Chart.yaml" ]; then
              charts+=("$dir")
            else
              echo "::notice::Skipping ${dir}: no Chart.yaml (not a helm chart, or the chart was deleted)"
            fi
          done
          echo "charts=$(jq -cn '$ARGS.positional' --args "${charts[@]}")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  render_and_validate:
    runs-on: ubuntu-latest
    needs: get_changed_helm_charts
    if: needs.get_changed_helm_charts.outputs.charts != '[]'
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.get_changed_helm_charts.outputs.charts) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: setup helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 #v4.3.1

      - name: install kubeconform
        run: |
          FILENAME="kubeconform-linux-amd64.tar.gz"
          DOWNLOAD_URL="${KUBECONFORM_BASE_URL}/v${KUBECONFORM_VERSION}/${FILENAME}"

          echo "Downloading kubeconform from ${DOWNLOAD_URL}..."
          wget -q "$DOWNLOAD_URL" -O "$FILENAME"

          echo "${KUBECONFORM_SHA256}  $FILENAME" | sha256sum -c -

          echo "Extracting kubeconform..."
          tar -xzf "$FILENAME"
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: render and validate ${{ matrix.chart }}
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path

          chart = Path(os.environ["CHART"])
          out = Path("shared/charts") / chart

          kubeconform = [
              "kubeconform",
              "-schema-location", "default",
              "-schema-location", os.environ["KUBECONFORM_SCHEMA_LOCATION"],
              "-schema-location", os.environ["KUBECONFORM_CUSTOM_SCHEMA_LOCATION"],
              "-summary",
              "-skip", "CustomResourceDefinition",
          ]
          if os.environ["STRICT"] == "true":
              kubeconform.append("-strict")

          # Every top-level yaml file besides Chart.yaml and values.yaml is a values file for one deployment.
          # It is layered on top of values.yaml and on any values file whose name is a prefix of its own,
          # e.g. values-prod-us-west1.yaml is layered on values-prod.yaml.
          values_files = {
              f.stem: f
              for f in sorted(chart.glob("*.y*ml"))
              if f.stem not in ("Chart", "values") and not f.name.startswith(".")
          }
          renders = {
              name: [f for prefix, f in values_files.items() if name.startswith(f"{prefix}-")] + [values_file]
              for name, values_file in values_files.items()
          }
          # Charts without values files of their own are rendered with values.yaml alone
          if not renders:
              renders = {"values": []}

          subprocess.run(["helm", "dependency", "update", chart], check=True)

          report = []
          for name, layers in renders.items():
              print(f"Rendering {chart} with {', '.join(['values.yaml', *(f.name for f in layers)])}", flush=True)
              values_args = [arg for f in layers for arg in ("-f", f)]
              # helm doesn't create the output directory when the chart renders no manifests
              (out / name).mkdir(parents=True, exist_ok=True)
              subprocess.run(["helm", "template", chart.name, chart, *values_args, "--output-dir", out / name], check=True)

              # Run from the render directory so the output names files relative to it
              result = subprocess.run([*kubeconform, "."], cwd=out / name, capture_output=True, text=True)
              print(result.stdout + result.stderr, flush=True)
              if result.returncode != 0:
                  output = f"{result.stdout}{result.stderr}".rstrip()
                  report.append(f"<details><summary>{chart} ({name})</summary>\n\n```text\n{output}\n```\n\n</details>\n")

          # The report job posts failures as a PR comment
          if report:
              reports = Path("shared/reports")
              reports.mkdir(parents=True, exist_ok=True)
              (reports / f"{os.environ['JOB_INDEX']}.md").write_text("\n".join(report))
              sys.exit(1)
        env:
          CHART: ${{ matrix.chart }}
          STRICT: ${{ inputs.strict }}
          JOB_INDEX: ${{ strategy.job-index }}

      - name: upload artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: "k8s-manifests-${{ strategy.job-index }}"
          path: "shared"

  report:
    runs-on: ubuntu-latest
    needs: render_and_validate
    if: ${{ !cancelled() && needs.render_and_validate.result != 'skipped' }}
    steps:
      - name: download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          pattern: k8s-manifests-*
          merge-multiple: true
          path: "shared"

      - name: comment kubeconform failures on pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- kubeconform-marker -->';
            const commentCharLimit = 65536;
            const issue = { issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo };

            // Minimize comments from previous runs
            const { data: comments } = await github.rest.issues.listComments(issue);
            for (const comment of comments) {
              if (comment.body.includes(marker) && comment.user.type === 'Bot') {
                await github.graphql(`
                  mutation MinimizeComment($subjectId: ID!) {
                    minimizeComment(input: { subjectId: $subjectId, classifier: OUTDATED }) {
                      minimizedComment { isMinimized }
                    }
                  }
                `, { subjectId: comment.node_id });
              }
            }

            const reportsDir = 'shared/reports';
            if (!fs.existsSync(reportsDir)) return;
            const reports = fs.readdirSync(reportsDir).sort().map(f => fs.readFileSync(`${reportsDir}/${f}`, 'utf8'));

            const output = `Kubernetes manifest validation failed:\n\n${reports.join('\n')}`;
            let body = `${output}\n${marker}`;
            if (body.length > commentCharLimit) {
              await core.summary.addRaw(output).write();
              const summaryUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              body = `Kubernetes manifest validation failed. The output is too long for a comment, see the [workflow run summary](${summaryUrl}).\n${marker}`;
            }
            await github.rest.issues.createComment({ ...issue, body });
