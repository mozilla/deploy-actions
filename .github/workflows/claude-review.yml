# Reusable workflow: Claude review of infrastructure pull requests.
# Reads the PR diff plus whatever change previews exist on the PR (Atlantis plan comments,
# Spacelift run comments, the Helm diff from diff-rendered-charts) and posts one review comment.
#
# Call it from a workflow triggered by `issue_comment` (plan comments and "@claude" requests),
# `pull_request` (review on open), or as a job after diff-rendered-charts. See
# .github/workflows/docs/claude-review.md.

name: claude review
on:
  workflow_call:
    inputs:
      mode:
        description: >-
          "auto" reviews when Atlantis or Spacelift post a plan comment and on the trigger phrase;
          "on-demand" only reviews on the trigger phrase.
        type: string
        default: auto
      trigger_phrase:
        description: Comment text (from a human) that requests a review.
        type: string
        default: "@claude"
      atlantis_bot:
        description: GitHub login of the Atlantis app that posts plan comments.
        type: string
        default: atlantis-admin[bot]
      spacelift_bot:
        description: GitHub login of the Spacelift app that posts run comments.
        type: string
        default: spacelift-io[bot]
      helm_diff_artifact:
        description: Artifact name from diff-rendered-charts (`diff_artifact` output) containing diff.log.
        type: string
        default: ""
      extra_prompt:
        description: Repository-specific review instructions appended to the base prompt.
        type: string
        default: ""
      model:
        description: Claude model; empty uses the claude-code-action default.
        type: string
        default: ""
      fallback_model:
        description: Fallback model; empty uses the default.
        type: string
        default: ""
      budget_usd:
        description: Maximum spend per review in USD.
        type: string
        default: "6.00"
      debounce_seconds:
        description: Wait before collecting context when a plan comment triggered the review.
        type: string
        default: "45"
      post_status:
        description: Also publish a `claude-review` commit status (caller needs statuses:write).
        type: boolean
        default: false
      pr_number:
        description: Explicit PR number (for workflow_dispatch callers). Otherwise taken from the event.
        type: string
        default: ""
      paths:
        description: >-
          Newline-separated path globs. When set, only PRs that change at least one matching file
          are reviewed (applies to every trigger, including plan comments).
        type: string
        default: ""
      paths_ignore:
        description: >-
          Newline-separated path globs. PRs whose changed files all match are not reviewed. Use it
          to hand a class of PRs to a dedicated caller (e.g. workgroup files to a skill review).
        type: string
        default: ""
      comment_marker:
        description: >-
          Identifier for this review's comments and concurrency group. Each caller on a repository
          needs its own marker so reviews do not collapse or cancel each other.
        type: string
        default: claude-review
      skill:
        description: >-
          Run a Claude Code skill instead of the built-in plan/Helm review, e.g.
          "/workgroups review {pr}". Pair with the plugin_* inputs when the skill lives in a plugin.
        type: string
        default: ""
      plugin_repository:
        description: >-
          owner/repo of a Claude Code plugin to load for skill mode (e.g. mozilla/mozcloud). Read
          with PLUGIN_REPO_TOKEN, a token minted from plugin_repo_app_id + PLUGIN_REPO_APP_KEY, or
          the default token for public repositories.
        type: string
        default: ""
      plugin_ref:
        description: Git ref of plugin_repository to check out.
        type: string
        default: main
      plugin_path:
        description: Path of the plugin inside plugin_repository (directory holding .claude-plugin/plugin.json).
        type: string
        default: ""
      plugin_repo_app_id:
        description: GitHub App ID used with PLUGIN_REPO_APP_KEY to mint a contents:read token for plugin_repository.
        type: string
        default: ""
      extra_allowed_tools:
        description: Newline-separated permission rules added to Claude's allow list in skill mode (e.g. "Bash(git log:*)").
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        description: Anthropic API key.
        required: true
      SLACK_WEBHOOK_URL:
        description: Optional incoming webhook; the scheduled health check posts there when reviews are failing.
        required: false
      PLUGIN_REPO_TOKEN:
        description: Optional token with contents:read on plugin_repository.
        required: false
      PLUGIN_REPO_APP_KEY:
        description: Optional GitHub App private key, used with plugin_repo_app_id.
        required: false

jobs:
  # Cheap classification. Comments that are not a review trigger are skipped here, before any
  # runner starts, and never enter the review job's concurrency group.
  gate:
    name: gate
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        (
          (contains(github.event.comment.body, inputs.trigger_phrase) && github.event.comment.user.type != 'Bot') ||
          (inputs.mode == 'auto' && github.event.comment.user.login == inputs.atlantis_bot && startsWith(github.event.comment.body, 'Ran Plan')) ||
          (inputs.mode == 'auto' && github.event.comment.user.login == inputs.spacelift_bot && contains(github.event.comment.body, 'spacelift.io/stack/') && !contains(github.event.comment.body, 'Deploy'))
        )
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Posts a short "nothing to review" reply when a human asks on a closed PR.
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      trigger: ${{ steps.gate.outputs.trigger }}
    steps:
      - name: Classify trigger and check the pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_TYPE: ${{ github.event.comment.user.type }}
          TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
          ATLANTIS_BOT: ${{ inputs.atlantis_bot }}
          SPACELIFT_BOT: ${{ inputs.spacelift_bot }}
          HELM_ARTIFACT: ${{ inputs.helm_diff_artifact }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          PATHS: ${{ inputs.paths }}
          PATHS_IGNORE: ${{ inputs.paths_ignore }}
          MARKER: ${{ inputs.comment_marker }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::Not reviewing: $1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          PR_NUMBER="${INPUT_PR:-$EVENT_PR}"
          [[ -n "$PR_NUMBER" ]] || skip "no pull request number in this event."
          # A repo can adopt the caller workflow before the secret exists without spamming PRs.
          [[ "$HAS_API_KEY" == "true" ]] || skip "ANTHROPIC_API_KEY secret is not set in this repository."

          TRIGGER=""
          case "$EVENT_NAME" in
            issue_comment)
              if [[ "$COMMENT_TYPE" != "Bot" && "$COMMENT_BODY" == *"$TRIGGER_PHRASE"* ]]; then
                TRIGGER=on-demand
              elif [[ "$COMMENT_LOGIN" == "$ATLANTIS_BOT" ]]; then
                TRIGGER=atlantis-plan
              elif [[ "$COMMENT_LOGIN" == "$SPACELIFT_BOT" ]]; then
                TRIGGER=spacelift-plan
              else
                skip "comment is not a review trigger."
              fi
              ;;
            pull_request|pull_request_target)
              [[ "$PR_AUTHOR_TYPE" != "Bot" ]] || skip "pull request opened by a bot; plan comments will still trigger a review."
              if [[ -n "$HELM_ARTIFACT" ]]; then TRIGGER=helm-diff; else TRIGGER=pull-request; fi
              ;;
            *)
              TRIGGER=on-demand
              ;;
          esac

          # Fail closed: an API error means "do not review".
          PR_JSON=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER") || skip "could not read PR #$PR_NUMBER."
          STATE=$(jq -r .state <<< "$PR_JSON")
          DRAFT=$(jq -r .draft <<< "$PR_JSON")
          HEAD_REPO=$(jq -r '.head.repo.full_name // ""' <<< "$PR_JSON")
          HEAD_SHA=$(jq -r .head.sha <<< "$PR_JSON")

          [[ "$HEAD_REPO" == "$REPOSITORY" ]] || skip "PR #$PR_NUMBER comes from '$HEAD_REPO' (fork or unknown); secrets are not exposed to it."

          if [[ "$STATE" != "open" ]]; then
            if [[ "$TRIGGER" == "on-demand" ]]; then
              # A human asked; answer so the request does not vanish.
              gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
                -f body="<!-- $MARKER -->
          ### Claude review: not run

          This pull request is **$STATE**; there is nothing current to review." > /dev/null
            fi
            skip "PR #$PR_NUMBER is $STATE."
          fi
          if [[ "$DRAFT" == "true" && "$TRIGGER" == "pull-request" ]]; then
            skip "PR #$PR_NUMBER is a draft."
          fi

          # Path filters apply to every trigger, since issue_comment events carry no paths.
          if [[ -n "$PATHS" || -n "$PATHS_IGNORE" ]]; then
            mapfile -t FILES < <(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
            matches_any() {  # $1 = newline-separated globs; true if any changed file matches any glob
              local f g
              while read -r g; do
                [[ -z "$g" ]] && continue
                for f in "${FILES[@]}"; do [[ "$f" == $g ]] && return 0; done
              done <<< "$1"
              return 1
            }
            all_match() {  # $1 = globs; true if every changed file matches some glob
              local f g ok
              for f in "${FILES[@]}"; do
                ok=false
                while read -r g; do
                  [[ -z "$g" ]] && continue
                  [[ "$f" == $g ]] && { ok=true; break; }
                done <<< "$1"
                [[ "$ok" == true ]] || return 1
              done
              return 0
            }
            if [[ -n "$PATHS" ]] && ! matches_any "$PATHS"; then
              skip "PR #$PR_NUMBER changes no file matching 'paths'."
            fi
            if [[ -n "$PATHS_IGNORE" && ${#FILES[@]} -gt 0 ]] && all_match "$PATHS_IGNORE"; then
              skip "every changed file in PR #$PR_NUMBER matches 'paths_ignore'."
            fi
          fi

          {
            echo "skip=false"
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "trigger=$TRIGGER"
          } >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #$PR_NUMBER ($TRIGGER) at $HEAD_SHA"

  review:
    name: review
    needs: gate
    if: ${{ needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One review per PR at a time; a newer plan comment or request supersedes a running review.
    # Only review triggers reach this job, so unrelated comments cannot cancel it.
    concurrency:
      group: ${{ inputs.comment_marker }}-${{ github.repository }}-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: true
    # Read-only: a token Claude could read is worth little.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.review.outputs.review }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          # Skills tend to read file history (`git log`); the plan review does not.
          fetch-depth: ${{ inputs.skill != '' && '0' || '1' }}
          persist-credentials: false

      # Optional plugin for skill mode. The plugin repository is usually internal, so a token
      # with read access is minted from a GitHub App or passed in; the default token only works
      # for public repositories. Only `plugin_path` is checked out.
      - name: Mint plugin repository token
        id: plugin_token
        if: ${{ inputs.plugin_repository != '' && inputs.plugin_repo_app_id != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.plugin_repo_app_id }}
          private-key: ${{ secrets.PLUGIN_REPO_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.plugin_repository }}
          permission-contents: read

      - name: Checkout plugin repository
        if: ${{ inputs.plugin_repository != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          repository: ${{ inputs.plugin_repository }}
          ref: ${{ inputs.plugin_ref }}
          token: ${{ steps.plugin_token.outputs.token || secrets.PLUGIN_REPO_TOKEN || github.token }}
          path: .claude-plugin-checkout
          sparse-checkout: ${{ inputs.plugin_path }}
          persist-credentials: false

      - name: Move plugin out of the workspace
        id: plugin
        if: ${{ inputs.plugin_repository != '' }}
        env:
          PLUGIN_PATH: ${{ inputs.plugin_path }}
          DEST: ${{ runner.temp }}/claude-plugins
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          NAME=$(basename "$PLUGIN_PATH")
          mv ".claude-plugin-checkout/$PLUGIN_PATH" "$DEST/$NAME"
          rm -rf .claude-plugin-checkout
          echo "dir=$DEST/$NAME" >> "$GITHUB_OUTPUT"

      # "$/" resolves to this workflow's own repository at the running commit, so the composite
      # action and its prompt always match this file. Needs runner 2.336.0+ (github.com has it).
      - name: Claude review
        id: review
        uses: $/claude-review
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} # zizmor: ignore[secrets-outside-env]
          pr_number: ${{ needs.gate.outputs.pr_number }}
          trigger: ${{ needs.gate.outputs.trigger }}
          atlantis_bot: ${{ inputs.atlantis_bot }}
          spacelift_bot: ${{ inputs.spacelift_bot }}
          helm_diff_artifact: ${{ inputs.helm_diff_artifact }}
          extra_prompt: ${{ inputs.extra_prompt }}
          model: ${{ inputs.model }}
          fallback_model: ${{ inputs.fallback_model }}
          budget: ${{ inputs.budget_usd }}
          debounce_seconds: ${{ inputs.debounce_seconds }}
          skill: ${{ inputs.skill }}
          plugin_dirs: ${{ steps.plugin.outputs.dir }}
          extra_allowed_tools: ${{ inputs.extra_allowed_tools }}
          comment_marker: ${{ inputs.comment_marker }}

  post:
    name: post
    needs: [gate, review]
    # Runs after a failed review job too (to report it), but not after a superseded one.
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' && needs.review.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post review
        uses: $/claude-review/post
        with:
          review: ${{ needs.review.outputs.review }}
          pr_number: ${{ needs.gate.outputs.pr_number }}
          post_status: ${{ inputs.post_status }}
          comment_marker: ${{ inputs.comment_marker }}

  # Scheduled self-check (callers add `on: schedule`). A review that never starts, e.g. because
  # the anthropics/claude-code-action ref fell off the org allowlist, is indistinguishable from a
  # slow one in the PR thread; this job turns a week of startup_failure into a failing run and,
  # with SLACK_WEBHOOK_URL set, a Slack message. Needs `actions: read` from the caller.
  health:
    name: health check
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Audit recent runs of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh run list --repo "$REPOSITORY" --workflow "$WORKFLOW" --created ">$SINCE" --limit 500 \
            --json conclusion,status,event > runs.json
          SUMMARY=$(jq -r '
            map(select(.event != "schedule"))
            | group_by(.conclusion // .status) | map({k: .[0].conclusion // .[0].status, n: length})
            | sort_by(-.n) | map("| \(.k) | \(.n) |") | join("\n")' runs.json)
          STARTUP=$(jq '[.[] | select(.conclusion == "startup_failure")] | length' runs.json)
          FAILED=$(jq '[.[] | select(.event != "schedule" and .conclusion == "failure")] | length' runs.json)
          OK=$(jq '[.[] | select(.event != "schedule" and .conclusion == "success")] | length' runs.json)
          {
            echo "### Claude review health, last 7 days (\`$WORKFLOW\` in $REPOSITORY)"
            echo
            echo "| conclusion | runs |"
            echo "|---|---|"
            echo "${SUMMARY:-| (no runs) | 0 |}"
          } >> "$GITHUB_STEP_SUMMARY"

          PROBLEM=""
          if [[ "$STARTUP" -gt 0 ]]; then
            PROBLEM="$STARTUP run(s) ended in startup_failure: the workflow is not starting at all (check the anthropics/claude-code-action ref against the org allowlist)."
          elif [[ "$FAILED" -gt 0 && "$OK" -eq 0 ]]; then
            PROBLEM="$FAILED failed run(s) and no successful review in 7 days."
          fi
          if [[ -z "$PROBLEM" ]]; then
            echo "Healthy: $OK successful review run(s), $FAILED failed, $STARTUP startup failures."
            exit 0
          fi
          echo "::error::Claude review unhealthy in $REPOSITORY: $PROBLEM"
          if [[ -n "$SLACK_WEBHOOK_URL" ]]; then
            jq -nc --arg text ":rotating_light: Claude review unhealthy in $REPOSITORY: $PROBLEM <$RUN_URL|details>" '{text: $text}' \
              | curl -fsS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" > /dev/null \
              || echo "::warning::Slack notification failed."
          fi
          exit 1
