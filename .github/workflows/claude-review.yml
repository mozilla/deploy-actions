# Reusable workflow: Claude review of infrastructure pull requests.
# Reads the PR diff plus whatever change previews exist on the PR (Atlantis plan comments,
# Spacelift run comments, the Helm diff from diff-rendered-charts) and posts one review comment.
#
# Call it from a workflow triggered by `issue_comment` (plan comments and "@claude" requests),
# `pull_request` (review on open), or as a job after diff-rendered-charts. See
# .github/workflows/docs/claude-review.md.

name: claude review
on:
  workflow_call:
    inputs:
      mode:
        description: >-
          "auto" reviews when Atlantis or Spacelift post a plan comment and on the trigger phrase;
          "on-demand" only reviews on the trigger phrase. Neither affects pull_request or
          workflow_dispatch callers, which review whenever they run.
        type: string
        default: auto
      trigger_phrase:
        description: Comment text (from a human) that requests a review.
        type: string
        default: "@claude"
      atlantis_bot:
        description: GitHub login of the Atlantis app that posts plan comments.
        type: string
        default: atlantis-admin[bot]
      spacelift_bot:
        description: GitHub login of the Spacelift app that posts run comments.
        type: string
        default: spacelift-io[bot]
      helm_diff_artifact:
        description: Artifact name from diff-rendered-charts (`diff_artifact` output) containing diff.log.
        type: string
        default: ""
      extra_prompt:
        description: Repository-specific review instructions appended to the base prompt.
        type: string
        default: ""
      model:
        description: Claude model; empty uses the claude-code-action default.
        type: string
        default: ""
      fallback_model:
        description: Fallback model; empty uses the default.
        type: string
        default: ""
      budget_usd:
        description: Maximum spend per review in USD.
        type: string
        default: "6.00"
      debounce_seconds:
        description: Wait before collecting context when a plan comment triggered the review.
        type: string
        default: "45"
      post_status:
        description: Also publish a `claude-review` commit status (caller needs statuses:write).
        type: boolean
        default: false
      pr_number:
        description: Explicit PR number (for workflow_dispatch callers). Otherwise taken from the event.
        type: string
        default: ""
      paths:
        description: >-
          Newline-separated path globs. When set, only PRs that change at least one matching file
          are reviewed (applies to every trigger, including plan comments).
        type: string
        default: ""
      paths_ignore:
        description: >-
          Newline-separated path globs. PRs whose changed files all match are not reviewed. Use it
          to hand a class of PRs to a dedicated caller with its own comment_marker.
        type: string
        default: ""
      comment_marker:
        description: >-
          Identifier for this review's comments and concurrency group. Each caller on a repository
          needs its own marker so reviews do not collapse or cancel each other.
        type: string
        default: claude-review
      skip_label:
        description: >-
          PR label that pauses automatic reviews (plan comments, Helm diff, pull_request) on that
          PR. The trigger phrase still requests a review.
        type: string
        default: no-claude-review
      skip_bot_prs:
        description: >-
          Skip automatic reviews (plan comments, Helm diff, pull_request) on pull requests opened
          by a bot such as Dependabot, whose plans are routinely automerged. The trigger phrase
          still requests a review.
        type: boolean
        default: true
      anthropic_federation_rule_id:
        description: >-
          Workload identity federation rule (fdrl_...) that accepts this repository's GitHub OIDC
          token. With anthropic_service_account_id, the review authenticates to the Claude API with
          the job's OIDC token instead of the ANTHROPIC_API_KEY secret; callers must grant
          id-token: write. These IDs are identifiers, not secrets (global-platform-admin
          anthropic/tf/console, `workloads` output).
        type: string
        default: ""
      anthropic_service_account_id:
        description: Anthropic service account (svac_...) the federated token acts as.
        type: string
        default: ""
      anthropic_workspace_id:
        description: >-
          Anthropic workspace (wrkspc_...) to scope the federated token to. Optional when the rule
          targets a single workspace.
        type: string
        default: ""
      anthropic_organization_id:
        description: Anthropic organization UUID for federation. Defaults to Mozilla's Claude Console organization.
        type: string
        default: bc6e8deb-65ec-4bee-8ca0-b8ff93b3295f
    secrets:
      ANTHROPIC_API_KEY:
        description: >-
          Anthropic API key. Leave it unset to use workload identity federation through the
          anthropic_federation_rule_id and anthropic_service_account_id inputs. When both are set
          the key wins and federation is not used.
        required: false
      SLACK_WEBHOOK_URL:
        description: Optional incoming webhook; the scheduled health check posts there when reviews are failing.
        required: false

jobs:
  # Cheap classification. Comments that are not a review trigger are skipped here, before any
  # runner starts, and never enter the review job's concurrency group.
  gate:
    name: gate
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        (
          (github.event.action == 'created' && github.event.comment.user.type != 'Bot' &&
           contains(github.event.comment.body, inputs.trigger_phrase) &&
           contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
          (inputs.mode == 'auto' && github.event.action == 'created' && github.event.comment.user.type == 'Bot' &&
           !contains(github.event.issue.labels.*.name, inputs.skip_label) &&
           (!inputs.skip_bot_prs || github.event.issue.user.type != 'Bot') &&
           startsWith(github.event.comment.body, 'Ran Plan') &&
           contains(format(',{0},{0}[bot],', inputs.atlantis_bot), format(',{0},', github.event.comment.user.login))) ||
          (inputs.mode == 'auto' && github.event.action != 'deleted' && github.event.comment.user.type == 'Bot' &&
           !contains(github.event.issue.labels.*.name, inputs.skip_label) &&
           (!inputs.skip_bot_prs || github.event.issue.user.type != 'Bot') &&
           contains(github.event.comment.body, 'spacelift.io/stack/') &&
           contains(format(',{0},{0}[bot],', inputs.spacelift_bot), format(',{0},', github.event.comment.user.login)))
        )
      ))
    # Bot logins are accepted with or without the "[bot]" suffix, and only from accounts of type
    # Bot: the bare slug of a GitHub App can also be a user account. Edited comments count only for
    # Spacelift, which updates its comments in place. Atlantis only creates comments, and when it
    # minimizes its previous plan comments GitHub raises `edited` events for them; without the
    # `created` check each new plan would start a second run. Humans trigger by posting a new
    # comment, and only with write access to the repository (OWNER, MEMBER or COLLABORATOR).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Posts a short "nothing to review" reply when a human asks on a closed PR.
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      trigger: ${{ steps.gate.outputs.trigger }}
    steps:
      - name: Classify trigger and check the pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_TYPE: ${{ github.event.comment.user.type }}
          COMMENT_ACTION: ${{ github.event.action }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
          ATLANTIS_BOT: ${{ inputs.atlantis_bot }}
          SPACELIFT_BOT: ${{ inputs.spacelift_bot }}
          HELM_ARTIFACT: ${{ inputs.helm_diff_artifact }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_FEDERATION: ${{ inputs.anthropic_federation_rule_id != '' && inputs.anthropic_service_account_id != '' }}
          PATHS: ${{ inputs.paths }}
          PATHS_IGNORE: ${{ inputs.paths_ignore }}
          MARKER: ${{ inputs.comment_marker }}
          SKIP_LABEL: ${{ inputs.skip_label }}
          SKIP_BOT_PRS: ${{ inputs.skip_bot_prs }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::Not reviewing: $1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          PR_NUMBER="${INPUT_PR:-$EVENT_PR}"
          [[ -n "$PR_NUMBER" ]] || skip "no pull request number in this event."
          # A repo can adopt the caller workflow before its credentials exist without spamming PRs.
          [[ "$HAS_API_KEY" == "true" || "$HAS_FEDERATION" == "true" ]] \
            || skip "neither the ANTHROPIC_API_KEY secret nor the anthropic_federation_rule_id and anthropic_service_account_id inputs are set."

          TRIGGER=""
          LOGIN="${COMMENT_LOGIN%\[bot\]}"
          case "$EVENT_NAME" in
            issue_comment)
              # The job-level `if` already applied these rules; they are repeated here so the
              # bash stays correct on its own. Phrase match is case-insensitive like contains().
              if [[ "$COMMENT_TYPE" != "Bot" && "${COMMENT_BODY,,}" == *"${TRIGGER_PHRASE,,}"* ]]; then
                case "$COMMENT_ASSOCIATION" in
                  OWNER|MEMBER|COLLABORATOR) ;;
                  *) skip "commenter is $COMMENT_ASSOCIATION, not a repository owner, member or collaborator." ;;
                esac
                [[ "$COMMENT_ACTION" == "created" ]] || skip "edited human comments are not a trigger."
                TRIGGER=on-demand
              elif [[ "$COMMENT_TYPE" == "Bot" && "$LOGIN" == "${ATLANTIS_BOT%\[bot\]}" ]]; then
                # Minimizing older plan comments raises `edited` events with the same body.
                [[ "$COMMENT_ACTION" == "created" ]] || skip "Atlantis comment was edited, not posted."
                TRIGGER=atlantis-plan
              elif [[ "$COMMENT_TYPE" == "Bot" && "$LOGIN" == "${SPACELIFT_BOT%\[bot\]}" ]]; then
                [[ "$COMMENT_ACTION" != "deleted" ]] || skip "Spacelift comment was deleted."
                # Deploy notifications (posted after merge) are not plans.
                if [[ "$COMMENT_BODY" =~ ^(:heavy_check_mark:|:x:)\ \*\*Deploy ]]; then
                  skip "Spacelift comment is a deploy notification."
                fi
                TRIGGER=spacelift-plan
              else
                skip "comment is not a review trigger."
              fi
              ;;
            pull_request|pull_request_target)
              if [[ -n "$HELM_ARTIFACT" ]]; then TRIGGER=helm-diff; else TRIGGER=pull-request; fi
              ;;
            *)
              TRIGGER=on-demand
              ;;
          esac

          # Fail closed: an API error means "do not review".
          PR_JSON=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER") || skip "could not read PR #$PR_NUMBER."
          STATE=$(jq -r .state <<< "$PR_JSON")
          DRAFT=$(jq -r .draft <<< "$PR_JSON")
          HEAD_REPO=$(jq -r '.head.repo.full_name // ""' <<< "$PR_JSON")
          HEAD_SHA=$(jq -r .head.sha <<< "$PR_JSON")

          [[ "$HEAD_REPO" == "$REPOSITORY" ]] || skip "PR #$PR_NUMBER comes from '$HEAD_REPO' (fork or unknown); secrets are not exposed to it."

          if [[ "$STATE" != "open" ]]; then
            if [[ "$TRIGGER" == "on-demand" ]]; then
              # A human asked; answer so the request does not vanish.
              gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
                -f body="<!-- $MARKER -->
          ### :robot: Claude review: on demand
          #### Not run

          This pull request is **$STATE**; there is nothing current to review." > /dev/null
            fi
            skip "PR #$PR_NUMBER is $STATE."
          fi
          if [[ "$DRAFT" == "true" && "$TRIGGER" == "pull-request" ]]; then
            skip "PR #$PR_NUMBER is a draft."
          fi
          # The label pauses automatic reviews while a PR iterates; an explicit request still wins.
          if [[ -n "$SKIP_LABEL" && "$TRIGGER" != "on-demand" ]] \
             && jq -e --arg l "$SKIP_LABEL" '[.labels[].name] | index($l) != null' <<< "$PR_JSON" > /dev/null; then
            skip "PR #$PR_NUMBER has the '$SKIP_LABEL' label; comment '$TRIGGER_PHRASE' for a one-off review."
          fi
          # Bot-authored PRs (Dependabot bumps) are planned and automerged routinely; reviewing
          # each one costs a run per bump for little signal. A human can still ask.
          if [[ "$SKIP_BOT_PRS" == "true" && "$TRIGGER" != "on-demand" && "$(jq -r '.user.type // ""' <<< "$PR_JSON")" == "Bot" ]]; then
            skip "PR #$PR_NUMBER was opened by a bot (skip_bot_prs); comment '$TRIGGER_PHRASE' for a one-off review."
          fi

          # Path filters apply to every trigger, since issue_comment events carry no paths.
          # Globs use bash pattern matching: `*` also matches `/` (unlike GitHub's `paths:`).
          if [[ -n "$PATHS" || -n "$PATHS_IGNORE" ]]; then
            FILE_LIST=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename') \
              || skip "could not list the changed files of PR #$PR_NUMBER."
            FILES=()
            [[ -z "$FILE_LIST" ]] || mapfile -t FILES <<< "$FILE_LIST"
            matches_any() {  # $1 = newline-separated globs; true if any changed file matches any glob
              local f g
              while read -r g; do
                [[ -z "$g" ]] && continue
                for f in "${FILES[@]}"; do [[ "$f" == $g ]] && return 0; done
              done <<< "$1"
              return 1
            }
            all_match() {  # $1 = globs; true if every changed file matches some glob
              local f g ok
              for f in "${FILES[@]}"; do
                ok=false
                while read -r g; do
                  [[ -z "$g" ]] && continue
                  [[ "$f" == $g ]] && { ok=true; break; }
                done <<< "$1"
                [[ "$ok" == true ]] || return 1
              done
              return 0
            }
            if [[ -n "$PATHS" ]] && ! matches_any "$PATHS"; then
              skip "PR #$PR_NUMBER changes no file matching 'paths'."
            fi
            if [[ -n "$PATHS_IGNORE" && ${#FILES[@]} -gt 0 ]] && all_match "$PATHS_IGNORE"; then
              skip "every changed file in PR #$PR_NUMBER matches 'paths_ignore'."
            fi
          fi

          {
            echo "skip=false"
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "trigger=$TRIGGER"
          } >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #$PR_NUMBER ($TRIGGER) at $HEAD_SHA"

  review:
    name: review
    needs: gate
    if: ${{ needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One review per PR at a time; a newer plan comment or request supersedes a running review.
    # Only review triggers reach this job, so unrelated comments cannot cancel it.
    concurrency:
      group: ${{ inputs.comment_marker }}-${{ github.repository }}-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: true
    # Read-only: a token Claude could read is worth little. checks/statuses let the collect step
    # read Atlantis `atlantis/plan:<project>` statuses and CI results; id-token lets the action
    # fetch the GitHub OIDC token it exchanges for an Anthropic token (workload identity
    # federation). Callers must grant all of them, whichever credential they use.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      id-token: write
    outputs:
      review: ${{ steps.review.outputs.review }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      # "$/" resolves to this workflow's own repository at the running commit, so the composite
      # action and its prompt always match this file. Needs runner 2.336.0+ (github.com has it).
      - name: Claude review
        id: review
        uses: $/claude-review
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} # zizmor: ignore[secrets-outside-env]
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          pr_number: ${{ needs.gate.outputs.pr_number }}
          trigger: ${{ needs.gate.outputs.trigger }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          skip_label: ${{ inputs.skip_label }}
          atlantis_bot: ${{ inputs.atlantis_bot }}
          spacelift_bot: ${{ inputs.spacelift_bot }}
          helm_diff_artifact: ${{ inputs.helm_diff_artifact }}
          extra_prompt: ${{ inputs.extra_prompt }}
          model: ${{ inputs.model }}
          fallback_model: ${{ inputs.fallback_model }}
          budget: ${{ inputs.budget_usd }}
          debounce_seconds: ${{ inputs.debounce_seconds }}
          comment_marker: ${{ inputs.comment_marker }}

  post:
    name: post
    needs: [gate, review]
    # Runs after a failed review job too (to report it), but not after a superseded (cancelled)
    # or skipped one.
    if: >-
      ${{ !cancelled() && needs.gate.outputs.skip != 'true' &&
          needs.review.result != 'skipped' && needs.review.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post review
        uses: $/claude-review/post
        with:
          review: ${{ needs.review.outputs.review }}
          pr_number: ${{ needs.gate.outputs.pr_number }}
          post_status: ${{ inputs.post_status }}
          comment_marker: ${{ inputs.comment_marker }}

  # Scheduled self-check (callers add `on: schedule`). A review that never starts, e.g. because
  # the anthropics/claude-code-action ref fell off the org allowlist, is indistinguishable from a
  # slow one in the PR thread; this job turns a week of startup_failure into a failing run and,
  # with SLACK_WEBHOOK_URL set, a Slack message. Needs `actions: read` from the caller.
  health:
    name: health check
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # No permissions block on purpose: GitHub validates every called job's permissions against
    # the caller's grant at startup, even for jobs that `if:` skips, so declaring `actions: read`
    # here would startup-fail every caller without it. Schedule callers grant it themselves.
    steps:
      - name: Audit recent runs of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh run list --repo "$REPOSITORY" --workflow "$WORKFLOW" --created ">$SINCE" --limit 200 \
            --json databaseId,conclusion,status,event > runs.json
          STARTUP=$(jq '[.[] | select(.conclusion == "startup_failure")] | length' runs.json)
          # Most runs end at the gate (unrelated comments) and count as success, which would hide
          # a broken review job, and the `review` job itself stays green when Claude fails because
          # the action step has continue-on-error. The `post` job fails whenever no review was
          # produced, so count that; in a caller it is named "<caller job> / post". Gate-only runs
          # skip it and are not counted.
          : > jobs.txt
          while read -r RUN_ID; do
            gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | test("(^|/ )post$")) | .conclusion // "in_progress"' >> jobs.txt \
              || echo "::warning::Could not list jobs of run $RUN_ID."
          done < <(jq -r '.[] | select(.event != "schedule" and .conclusion != "startup_failure") | .databaseId' runs.json)
          SUMMARY=$(sort jobs.txt | uniq -c | sort -rn | awk '{printf "| %s | %s |\n", $2, $1}')
          FAILED=$(grep -c '^failure$' jobs.txt || true)
          OK=$(grep -c '^success$' jobs.txt || true)
          {
            echo "### Claude review health, last 7 days (\`$WORKFLOW\` in $REPOSITORY)"
            echo
            echo "| post job conclusion | runs |"
            echo "|---|---|"
            echo "${SUMMARY:-| (no review runs) | 0 |}"
            echo
            echo "Workflow runs ending in startup_failure: $STARTUP"
          } >> "$GITHUB_STEP_SUMMARY"

          # The claude-code-action ref is resolved inside the composite at job time, so an
          # allowlist break shows up as failed post jobs, not startup_failure. Both are covered.
          PROBLEM=""
          if [[ "$STARTUP" -gt 0 ]]; then
            PROBLEM="$STARTUP run(s) ended in startup_failure: the caller workflow itself is not starting."
          elif [[ "$FAILED" -gt 0 && "$OK" -eq 0 ]]; then
            PROBLEM="$FAILED review(s) produced nothing and none succeeded in 7 days (check the anthropics/claude-code-action ref against the org allowlist)."
          elif [[ "$FAILED" -gt "$OK" ]]; then
            PROBLEM="$FAILED failed review job(s) against $OK successful in 7 days."
          fi
          if [[ -z "$PROBLEM" ]]; then
            echo "Healthy: $OK successful review job(s), $FAILED failed, $STARTUP startup failures."
            exit 0
          fi
          echo "::error::Claude review unhealthy in $REPOSITORY: $PROBLEM"
          if [[ -n "$SLACK_WEBHOOK_URL" ]]; then
            jq -nc --arg text ":rotating_light: Claude review unhealthy in $REPOSITORY: $PROBLEM <$RUN_URL|details>" '{text: $text}' \
              | curl -fsS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" > /dev/null \
              || echo "::warning::Slack notification failed."
          fi
          exit 1
